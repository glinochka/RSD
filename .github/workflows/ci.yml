name: Test Backend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        env:
          PYTHONPATH: ./backend 
          ALGORITHM: HS256
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          USER_JWT_SECRET_KEY: 798cd1b6cb25d52ce4e49824b01b5b22a117325ad327161c50ad5a8c2898fc89
          ADMIN_JWT_SECRET_KEY: 49f53158c1d7074372655dd0ed25ed35a6abfd1311621670907977abd025a06f
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          ENCRYPTION_KEY: test-encryption-key-for-fernet-ci
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: ""
          DEEPSEEK_API_KEY: fake-deepseek-key
          MASTER_BOT_TOKEN: fake:token
          BASE_URL: http://localhost:8000
          ADMIN_WEB_LOGIN: admin
          ADMIN_WEB_PASSWORD: admin123
          API_HOST: localhost
          API_PORT: 8000
        run: |
          cd backend
          pytest app/tests/ -v --cov=app