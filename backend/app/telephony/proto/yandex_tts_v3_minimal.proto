syntax = "proto3";

package speechkit.tts.v3;

// Extended subset for Synthesizer.StreamSynthesis (Yandex SpeechKit TTS v3).
// Includes hints for better voice quality.

message RawAudio {
  enum AudioEncoding {
    AUDIO_ENCODING_UNSPECIFIED = 0;
    LINEAR16_PCM = 1;
  }
  AudioEncoding audio_encoding = 1;
  int64 sample_rate_hertz = 2;
}

message AudioFormatOptions {
  RawAudio raw_audio = 1;
}

// Hint to improve synthesis quality
message Hints {
  oneof hint {
    string voice = 1;
    // Other hints can be added here
  }
}

message SynthesisOptions {
  string voice = 2;
  double speed = 4;
  AudioFormatOptions output_audio_spec = 7;
  repeated Hints hints = 8;  // Hints for better voice quality
}

message SynthesisInput {
  string text = 1;
}

message ForceSynthesisEvent {}

message StreamSynthesisRequest {
  oneof Event {
    SynthesisOptions options = 1;
    SynthesisInput synthesis_input = 2;
    ForceSynthesisEvent force_synthesis = 3;
  }
}

message AudioChunk {
  bytes data = 1;
}

message StreamSynthesisResponse {
  AudioChunk audio_chunk = 1;
}

service Synthesizer {
  rpc StreamSynthesis(stream StreamSynthesisRequest) returns (stream StreamSynthesisResponse);
}
