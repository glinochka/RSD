# Nginx Configuration for Website Builder - Stage 7: Custom Domains and Subdomains
#
# This configuration supports:
# 1. Subdomain routing: {slug}.rsd-ai.ru -> /w/{slug}
# 2. Custom domain routing: example.com -> website by domain
# 3. Wildcard SSL for *.rsd-ai.ru
#
# Prerequisites:
# - SSL certificates for rsd-ai.ru and *.rsd-ai.ru (Let's Encrypt)
# - DNS A/AAAA records pointing to this server

# ============================================
# Upstream (backend FastAPI application)
# ============================================
upstream backend {
    server 127.0.0.1:8000;
}

# ============================================
# Wildcard server block for *.rsd-ai.ru subdomains
# Handles: mysite.rsd-ai.ru, shop.rsd-ai.ru, etc.
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name *.rsd-ai.ru;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.rsd-ai.ru;

    # Wildcard SSL certificate
    ssl_certificate /etc/letsencrypt/live/rsd-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsd-ai.ru/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static files (for exported websites)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (bypasses website resolution)
    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # API requests (bypasses website resolution)
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-running operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public website schema endpoint (for subdomain detection)
    # The backend uses Host header to determine which website to serve
    location /public-website/ {
        proxy_pass http://backend/public-website/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main website serving - uses Host header to detect website
    # This serves the React frontend which then fetches schema based on domain
    location / {
        # Pass to backend which handles subdomain resolution
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Add custom header for website detection
        proxy_set_header X-Website-Host $host;
    }
}

# ============================================
# Main domain server block
# Handles: rsd-ai.ru, www.rsd-ai.ru
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name rsd-ai.ru www.rsd-ai.ru;
    return 301 https://rsd-ai.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rsd-ai.ru www.rsd-ai.ru;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/rsd-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsd-ai.ru/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Redirect www to non-www
    if ($host = www.rsd-ai.ru) {
        return 301 https://rsd-ai.ru$request_uri;
    }

    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    # API
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default - serve main application
    location / {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================
# Custom domain server block (catch-all)
# Handles: example.com, www.example.com, etc.
# This uses SNI to route to the correct website
# ============================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Certbot will handle certificate generation for custom domains
    # For now, we redirect to HTTPS which will use the appropriate cert
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Default fallback certificate (for unknown domains)
    # Certbot will generate separate server blocks for verified domains
    ssl_certificate /etc/letsencrypt/live/rsd-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsd-ai.ru/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Map to detect if this is a custom domain or a system domain
    # System domains get special handling
    set $is_system_domain "0";
    if ($host ~* "^(.+\.)?rsd-ai\.ru$") {
        set $is_system_domain "1";
    }

    # API access for all domains
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public website endpoint (backend resolves by Host header)
    location /public-website/ {
        proxy_pass http://backend/public-website/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Website-Host $host;
    }

    # Main website serving
    location / {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Website-Host $host;
        proxy_set_header X-Custom-Domain "1";
    }
}

