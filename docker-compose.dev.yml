# Local development overlay: live code mounts + nginx with TLS on :80/:443.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
    backend:
        volumes:
            - ./backend:/backend
            - /backend/__pycache__

    bot:
        volumes:
            - ./bot:/app

    telephony_worker:
        volumes:
            - ./backend:/backend

    telephony_orchestrator:
        volumes:
            - ./backend:/backend

    frontend:
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./ssl:/etc/nginx/ssl:ro
