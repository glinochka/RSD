# Production overlay: GHCR images, edge proxy (443 stays up during app rolls).
# Usage: see scripts/deploy.sh and docs/DEPLOY.md
services:
    proxy:
        image: nginx:1.27-alpine
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./ssl:/etc/nginx/ssl:ro
        depends_on:
            frontend:
                condition: service_started
            backend:
                condition: service_healthy
            telephony_bridge:
                condition: service_healthy
        networks:
            - rsd_network

    backend:
        image: ${REGISTRY}/rsd-backend:${IMAGE_TAG}
        pull_policy: always
        command: python server.py

    telephony_worker:
        image: ${REGISTRY}/rsd-backend:${IMAGE_TAG}
        pull_policy: always

    telephony_orchestrator:
        image: ${REGISTRY}/rsd-backend:${IMAGE_TAG}
        pull_policy: always

    frontend:
        image: ${REGISTRY}/rsd-frontend:${IMAGE_TAG}
        pull_policy: always

    bot:
        image: ${REGISTRY}/rsd-bot:${IMAGE_TAG}
        pull_policy: always

    telephony_bridge:
        image: ${REGISTRY}/rsd-telephony-bridge:${IMAGE_TAG}
        pull_policy: always

    telephony_media_gateway:
        image: ${REGISTRY}/rsd-telephony-media-gateway:${IMAGE_TAG}
        pull_policy: always

    wa_bridge:
        image: ${REGISTRY}/rsd-wa-bridge:${IMAGE_TAG}
        pull_policy: always
