services:

    postgres:
        restart: always
        image: postgres:15-alpine  
        container_name: rsd_db
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "127.0.0.1:${DB_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - rsd_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build: ./backend
        command: >
            sh -c "cd app/alembic && alembic upgrade head &&
                cd .. && cd .. && python server.py"
        env_file:
            - .env
                
        container_name: rsd_backend
        environment:
            HF_ENDPOINT: https://hf-mirror.com
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            SECRET_KEY: ${SECRET_KEY}
            ALGORITHM: ${ALGORITHM}
            ENCRYPTION_KEY: ${ENCRYPTION_KEY}
            BASE_URL: ${BASE_URL}
            QDRANT_URL: ${QDRANT_URL}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
            WHATSAPP_USERBOT_BRIDGE_URL: ${WHATSAPP_USERBOT_BRIDGE_URL:-http://wa_bridge:8090}
            WHATSAPP_USERBOT_BRIDGE_API_KEY: ${WHATSAPP_USERBOT_BRIDGE_API_KEY:-}
            WHATSAPP_USERBOT_BRIDGE_TIMEOUT_SECONDS: ${WHATSAPP_USERBOT_BRIDGE_TIMEOUT_SECONDS:-25}
        ports:
            - '8000:8000'
        depends_on:
            qdrant:
                condition: service_started
            postgres:
                condition: service_healthy
            wa_bridge:
                condition: service_healthy
            
        networks:
            - rsd_network
        volumes:
            - ./backend:/backend
            - /app/__pycache__
            - fastembed_cache:/tmp/fastembed_cache



    # Frontend: built with Vite, served by Nginx.
    # Leave VITE_API_BASE_URL unset or empty: API paths already include /api (see frontend constants).
    # Setting VITE_API_BASE_URL=/api causes /api/api/... and 404 on the backend.
    frontend:
        restart: always
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        container_name: rsd_frontend
        ports:
            # Port 3000 to align with backend/app/origins.py (CORS allows http://localhost:3000)
            - "80:80"
            - "443:443"
        volumes:
            - ./ssl:/etc/nginx/ssl:ro
        depends_on:
            backend:
                condition: service_started
            bot:
                condition: service_started
        networks:
            - rsd_network

    bot:
        build: ./bot
        container_name: rsd_bot
        env_file:
            - .env
        depends_on:
            - backend
        environment:
            ENCRYPTION_KEY: ${ENCRYPTION_KEY}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
            DB_NAME: ${DB_NAME}
            MASTER_BOT_TOKEN: ${MASTER_BOT_TOKEN}
            BOT_PAYMENT_TOKEN: ${BOT_PAYMENT_TOKEN}
            BASE_URL: ${BASE_URL}
            API_HOST: ${API_HOST}
            API_PORT: ${API_PORT}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
        command: >
            python main.py
        ports:
            - "8002:8002"
        networks:
            - rsd_network
        volumes:
            - ./bot:/app

    wa_bridge:
        build: ./wa_bridge
        container_name: rsd_wa_bridge
        restart: unless-stopped
        environment:
            WA_USERBOT_ENV: ${WA_USERBOT_ENV:-production}
            WA_USERBOT_BRIDGE_API_KEY: ${WHATSAPP_USERBOT_BRIDGE_API_KEY:-}
            WA_USERBOT_AUTH_TTL_SECONDS: ${WA_USERBOT_AUTH_TTL_SECONDS:-600}
            WA_USERBOT_AUTH_MAX_ATTEMPTS: ${WA_USERBOT_AUTH_MAX_ATTEMPTS:-5}
            WA_USERBOT_REQUEST_WINDOW_SECONDS: ${WA_USERBOT_REQUEST_WINDOW_SECONDS:-60}
            WA_USERBOT_REQUESTS_PER_PHONE_LIMIT: ${WA_USERBOT_REQUESTS_PER_PHONE_LIMIT:-5}
            WA_USERBOT_VERIFY_WINDOW_SECONDS: ${WA_USERBOT_VERIFY_WINDOW_SECONDS:-60}
            WA_USERBOT_VERIFY_PER_PHONE_LIMIT: ${WA_USERBOT_VERIFY_PER_PHONE_LIMIT:-10}
            WA_USERBOT_SESSION_SECRET: ${WA_USERBOT_SESSION_SECRET:-}
            WA_USERBOT_DEV_EXPOSE_CODE: ${WA_USERBOT_DEV_EXPOSE_CODE:-false}
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - rsd_network

    qdrant:
        restart: on-failure
        image: qdrant/qdrant:latest
        container_name: rsd_qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - qdrant_data:/qdrant/storage
        networks:
            - rsd_network

networks:
  rsd_network:
    driver: bridge

volumes:
    fastembed_cache:
    postgres_data:
    qdrant_data:
