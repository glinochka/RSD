services:

    redis:
        restart: always
        image: redis:7-alpine
        container_name: rsd_redis
        ports:
            - "127.0.0.1:6379:6379"
        networks:
            - rsd_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    postgres:
        restart: always
        image: postgres:15-alpine  
        container_name: rsd_db
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "127.0.0.1:${DB_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - rsd_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        restart: unless-stopped
        build: ./backend
        command: >
            sh -c "cd app/alembic && alembic upgrade head &&
                cd .. && cd .. && python server.py"
        env_file:
            - .env
                
        container_name: rsd_backend
        environment:
            # Do not set HF_ENDPOINT here. Mirroring sites (e.g. hf-mirror.com) often break
            # with current huggingface_hub (redirects / domain checks). Use the public hub by
            # default; override HF_ENDPOINT in .env only if you have a compatible mirror.
            TELEGRAM_USERBOT_API_ID: ${TELEGRAM_USERBOT_API_ID:-0}
            TELEGRAM_USERBOT_API_HASH: ${TELEGRAM_USERBOT_API_HASH:-}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            SECRET_KEY: ${SECRET_KEY}
            ALGORITHM: ${ALGORITHM}
            ENCRYPTION_KEY: ${ENCRYPTION_KEY}
            BASE_URL: ${BASE_URL}
            QDRANT_URL: ${QDRANT_URL}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
            WHATSAPP_USERBOT_BRIDGE_URL: ${WHATSAPP_USERBOT_BRIDGE_URL:-http://wa_bridge:8090}
            WHATSAPP_USERBOT_BRIDGE_API_KEY: ${WHATSAPP_USERBOT_BRIDGE_API_KEY:-}
            WHATSAPP_USERBOT_BRIDGE_TIMEOUT_SECONDS: ${WHATSAPP_USERBOT_BRIDGE_TIMEOUT_SECONDS:-60}
            WA_USERBOT_SESSION_SECRET: ${WA_USERBOT_SESSION_SECRET:?WA_USERBOT_SESSION_SECRET must be set}
            TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
            TELEPHONY_INTERNAL_API_KEY: ${TELEPHONY_INTERNAL_API_KEY:-}
            INTERNAL_REQUEST_SIGNING_SECRET: ${INTERNAL_REQUEST_SIGNING_SECRET:-}
            TELEPHONY_WEBHOOK_BASE_URL: ${TELEPHONY_WEBHOOK_BASE_URL:-}
            TELEPHONY_WEBHOOK_SIGNATURE_TTL_SECONDS: ${TELEPHONY_WEBHOOK_SIGNATURE_TTL_SECONDS:-300}
            TELEPHONY_WEBHOOK_RATE_LIMIT_PER_CONNECTION: ${TELEPHONY_WEBHOOK_RATE_LIMIT_PER_CONNECTION:-120}
            TELEPHONY_WEBHOOK_RATE_LIMIT_PER_IP: ${TELEPHONY_WEBHOOK_RATE_LIMIT_PER_IP:-240}
            TELEPHONY_WEBHOOK_RATE_WINDOW_SECONDS: ${TELEPHONY_WEBHOOK_RATE_WINDOW_SECONDS:-60}
            TELEPHONY_TURNS_RETENTION_DAYS: ${TELEPHONY_TURNS_RETENTION_DAYS:-90}
            TELEPHONY_LLM_TIMEOUT_SECONDS: ${TELEPHONY_LLM_TIMEOUT_SECONDS:-25}
            TELEPHONY_LLM_RETRY_TIMEOUT_SECONDS: ${TELEPHONY_LLM_RETRY_TIMEOUT_SECONDS:-15}
            TELEPHONY_PREVIEW_LLM_TIMEOUT_SECONDS: ${TELEPHONY_PREVIEW_LLM_TIMEOUT_SECONDS:-60}
            TELEPHONY_TURN_LATENCY_ALERT_P95_MS: ${TELEPHONY_TURN_LATENCY_ALERT_P95_MS:-10000}
            TELEPHONY_E2R_ALERT_P90_MS: ${TELEPHONY_E2R_ALERT_P90_MS:-850}
            TELEPHONY_ORCHESTRATOR_ENABLED: ${TELEPHONY_ORCHESTRATOR_ENABLED:-true}
            TELEPHONY_STREAMING_ENABLED: ${TELEPHONY_STREAMING_ENABLED:-true}
            TELEPHONY_STREAM_TTS_PROVIDER: ${TELEPHONY_STREAM_TTS_PROVIDER:-yandex}
            TELEPHONY_LLM_MODE: ${TELEPHONY_LLM_MODE:-chat}
            TELEPHONY_SYNTAGMA_MIN_CHARS: ${TELEPHONY_SYNTAGMA_MIN_CHARS:-12}
            GROQ_API_KEY: ${GROQ_API_KEY:-}
            ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
            TELEPHONY_MAX_TURNS: ${TELEPHONY_MAX_TURNS:-15}
            TELEPHONY_MAX_CALL_MINUTES: ${TELEPHONY_MAX_CALL_MINUTES:-15}
            TELEPHONY_MAX_TURN_SECONDS: ${TELEPHONY_MAX_TURN_SECONDS:-30}
            TELEPHONY_CRM_FILLER_THRESHOLD_MS: ${TELEPHONY_CRM_FILLER_THRESHOLD_MS:-1500}
            TELEPHONY_DEDICATED_POOL_ENABLED: ${TELEPHONY_DEDICATED_POOL_ENABLED:-true}
            TELEPHONY_DEDICATED_POOL_SIZE: ${TELEPHONY_DEDICATED_POOL_SIZE:-8}
            TELEPHONY_SSML_ENABLED: ${TELEPHONY_SSML_ENABLED:-true}
            TELEPHONY_TTS_PROVIDER: ${TELEPHONY_TTS_PROVIDER:-voximplant}
            YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
            YANDEX_SPEECHKIT_FOLDER_ID: ${YANDEX_SPEECHKIT_FOLDER_ID:-}
            TELEPHONY_TTS_TIMEOUT_SECONDS: ${TELEPHONY_TTS_TIMEOUT_SECONDS:-20}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
            VOXIMPLANT_API_BASE_URL: ${VOXIMPLANT_API_BASE_URL:-https://api.voximplant.com/platform_api}
            TELEPHONY_VOXIMPLANT_API_TIMEOUT_SECONDS: ${TELEPHONY_VOXIMPLANT_API_TIMEOUT_SECONDS:-15}
            TELEPHONY_SHARED_POOL_E164: ${TELEPHONY_SHARED_POOL_E164:-}
            TELEPHONY_VOXIMPLANT_ACCOUNT_ID: ${TELEPHONY_VOXIMPLANT_ACCOUNT_ID:-}
            TELEPHONY_VOXIMPLANT_API_KEY: ${TELEPHONY_VOXIMPLANT_API_KEY:-}
            TELEPHONY_VOXIMPLANT_APPLICATION_ID: ${TELEPHONY_VOXIMPLANT_APPLICATION_ID:-}
            TELEPHONY_VOXIMPLANT_RULE_ID: ${TELEPHONY_VOXIMPLANT_RULE_ID:-}
            TELEPHONY_OPERATOR_TRANSFER_E164: ${TELEPHONY_OPERATOR_TRANSFER_E164:-}
        ports:
            - '8000:8000'
        depends_on:
            qdrant:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            wa_bridge:
                condition: service_healthy
            
        networks:
            - rsd_network
        volumes:
            - ./backend:/backend
            - /app/__pycache__
            - fastembed_cache:/tmp/fastembed_cache



    # Frontend: built with Vite, served by Nginx.
    # Leave VITE_API_BASE_URL unset or empty: API paths already include /api (see frontend constants).
    # Setting VITE_API_BASE_URL=/api causes /api/api/... and 404 on the backend.
    frontend:
        restart: always
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
                VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
                VITE_WIDGET_API_BASE: ${VITE_WIDGET_API_BASE:-}
                VITE_WIDGET_API_KEY: ${VITE_WIDGET_API_KEY:-}
                VITE_WIDGET_POSITION: ${VITE_WIDGET_POSITION:-bottom-right}
                VITE_WIDGET_TITLE: ${VITE_WIDGET_TITLE:-}
                VITE_WIDGET_GREETING: ${VITE_WIDGET_GREETING:-}
                VITE_WIDGET_PLACEHOLDER: ${VITE_WIDGET_PLACEHOLDER:-}
                VITE_WIDGET_THEME: ${VITE_WIDGET_THEME:-dark}
                VITE_WIDGET_PROACTIVE_MESSAGE: ${VITE_WIDGET_PROACTIVE_MESSAGE:-}
                VITE_WIDGET_PROACTIVE_DELAY: ${VITE_WIDGET_PROACTIVE_DELAY:-}
                VITE_WIDGET_PROACTIVE_MESSAGE_2: ${VITE_WIDGET_PROACTIVE_MESSAGE_2:-}
                VITE_WIDGET_PROACTIVE_DELAY_2: ${VITE_WIDGET_PROACTIVE_DELAY_2:-}
        container_name: rsd_frontend
        ports:
            # Port 3000 to align with backend/app/origins.py (CORS allows http://localhost:3000)
            - "80:80"
            - "443:443"
        volumes:
            - ./ssl:/etc/nginx/ssl:ro
        depends_on:
            backend:
                condition: service_started
            bot:
                condition: service_started
            telephony_bridge:
                condition: service_healthy
        networks:
            - rsd_network

    bot:
        restart: unless-stopped
        build: ./bot
        container_name: rsd_bot
        env_file:
            - .env
        depends_on:
            - backend
        environment:
            ENCRYPTION_KEY: ${ENCRYPTION_KEY}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
            DB_NAME: ${DB_NAME}
            MASTER_BOT_TOKEN: ${MASTER_BOT_TOKEN}
            BOT_PAYMENT_TOKEN: ${BOT_PAYMENT_TOKEN}
            BASE_URL: ${BASE_URL}
            API_HOST: ${API_HOST}
            API_PORT: ${API_PORT}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
            WHATSAPP_USERBOT_BRIDGE_URL: ${WHATSAPP_USERBOT_BRIDGE_URL:-http://wa_bridge:8090}
            WHATSAPP_USERBOT_BRIDGE_API_KEY: ${WHATSAPP_USERBOT_BRIDGE_API_KEY:-}
            WHATSAPP_USERBOT_BRIDGE_TIMEOUT_SECONDS: ${WHATSAPP_USERBOT_BRIDGE_TIMEOUT_SECONDS:-60}
        command: >
            python main.py
        ports:
            - "8002:8002"
        networks:
            - rsd_network
        volumes:
            - ./bot:/app

    telephony_worker:
        build: ./backend
        container_name: rsd_telephony_worker
        restart: unless-stopped
        command: >
            sh -c "python -m app.telephony.worker_main"
        env_file:
            - .env
        environment:
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
            TELEPHONY_INTERNAL_API_KEY: ${TELEPHONY_INTERNAL_API_KEY:-}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
            INTERNAL_REQUEST_SIGNING_SECRET: ${INTERNAL_REQUEST_SIGNING_SECRET:-}
            TELEPHONY_STREAMING_ENABLED: ${TELEPHONY_STREAMING_ENABLED:-true}
            TELEPHONY_STREAM_TTS_PROVIDER: ${TELEPHONY_STREAM_TTS_PROVIDER:-yandex}
            TELEPHONY_LLM_MODE: ${TELEPHONY_LLM_MODE:-chat}
            TELEPHONY_SYNTAGMA_MIN_CHARS: ${TELEPHONY_SYNTAGMA_MIN_CHARS:-12}
            YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
            YANDEX_SPEECHKIT_FOLDER_ID: ${YANDEX_SPEECHKIT_FOLDER_ID:-}
            ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
            GROQ_API_KEY: ${GROQ_API_KEY:-}
            TELEPHONY_DEDICATED_POOL_ENABLED: ${TELEPHONY_DEDICATED_POOL_ENABLED:-true}
            TELEPHONY_DEDICATED_POOL_SIZE: ${TELEPHONY_DEDICATED_POOL_SIZE:-8}
            TELEPHONY_WORKER_PORT: ${TELEPHONY_WORKER_PORT:-8001}
            TELEPHONY_LLM_TIMEOUT_SECONDS: ${TELEPHONY_LLM_TIMEOUT_SECONDS:-25}
            TELEPHONY_LLM_RETRY_TIMEOUT_SECONDS: ${TELEPHONY_LLM_RETRY_TIMEOUT_SECONDS:-15}
            TELEPHONY_PREVIEW_LLM_TIMEOUT_SECONDS: ${TELEPHONY_PREVIEW_LLM_TIMEOUT_SECONDS:-60}
            TELEPHONY_TTS_PROVIDER: ${TELEPHONY_TTS_PROVIDER:-yandex}
            TELEPHONY_TTS_TIMEOUT_SECONDS: ${TELEPHONY_TTS_TIMEOUT_SECONDS:-20}
            TELEPHONY_MAX_TURNS: ${TELEPHONY_MAX_TURNS:-15}
            TELEPHONY_MAX_CALL_MINUTES: ${TELEPHONY_MAX_CALL_MINUTES:-15}
            TELEPHONY_MAX_TURN_SECONDS: ${TELEPHONY_MAX_TURN_SECONDS:-30}
            TELEPHONY_CRM_FILLER_THRESHOLD_MS: ${TELEPHONY_CRM_FILLER_THRESHOLD_MS:-1500}
            TELEPHONY_SSML_ENABLED: ${TELEPHONY_SSML_ENABLED:-true}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
            QDRANT_URL: ${QDRANT_URL}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
        ports:
            - "8001:8001"
        depends_on:
            postgres:
                condition: service_healthy
            qdrant:
                condition: service_started
        networks:
            - rsd_network
        volumes:
            - ./backend:/backend

    telephony_bridge:
        build: ./telephony_bridge
        container_name: rsd_telephony_bridge
        restart: unless-stopped
        env_file:
            - .env
        environment:
            TELEPHONY_BRIDGE_API_KEY: ${TELEPHONY_BRIDGE_API_KEY:-}
            TELEPHONY_BACKEND_INTERNAL_KEY: ${TELEPHONY_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
            TELEPHONY_BACKEND_SIGNING_SECRET: ${INTERNAL_REQUEST_SIGNING_SECRET:-}
            TELEPHONY_WEBHOOK_SIGNATURE_TTL_SECONDS: ${TELEPHONY_WEBHOOK_SIGNATURE_TTL_SECONDS:-300}
            TELEPHONY_WEBHOOK_RATE_LIMIT_PER_CONNECTION: ${TELEPHONY_WEBHOOK_RATE_LIMIT_PER_CONNECTION:-120}
            TELEPHONY_WEBHOOK_RATE_LIMIT_PER_IP: ${TELEPHONY_WEBHOOK_RATE_LIMIT_PER_IP:-240}
            TELEPHONY_WEBHOOK_RATE_WINDOW_SECONDS: ${TELEPHONY_WEBHOOK_RATE_WINDOW_SECONDS:-60}
            TELEPHONY_BACKEND_REQUEST_TIMEOUT_MS: ${TELEPHONY_BACKEND_REQUEST_TIMEOUT_MS:-15000}
            TELEPHONY_SESSION_STORE: ${TELEPHONY_SESSION_STORE:-redis}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
            TELEPHONY_BACKEND_URL: ${TELEPHONY_BACKEND_URL:-http://telephony_worker:8001}
            TELEPHONY_BRIDGE_CONTROL_ONLY: ${TELEPHONY_BRIDGE_CONTROL_ONLY:-true}
            PORT: "8100"
        ports:
            - "8100:8100"
        depends_on:
            redis:
                condition: service_healthy
            telephony_worker:
                condition: service_started
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - rsd_network

    telephony_orchestrator:
        build: ./backend
        container_name: rsd_telephony_orchestrator
        restart: unless-stopped
        command: >
            sh -c "python -m app.telephony.orchestrator_main"
        env_file:
            - .env
        environment:
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
            TELEPHONY_ORCHESTRATOR_ENABLED: ${TELEPHONY_ORCHESTRATOR_ENABLED:-true}
            TELEPHONY_STREAMING_ENABLED: ${TELEPHONY_STREAMING_ENABLED:-true}
            TELEPHONY_DEDICATED_POOL_ENABLED: ${TELEPHONY_DEDICATED_POOL_ENABLED:-true}
            TELEPHONY_DEDICATED_POOL_SIZE: ${TELEPHONY_DEDICATED_POOL_SIZE:-8}
            TELEPHONY_LLM_TIMEOUT_SECONDS: ${TELEPHONY_LLM_TIMEOUT_SECONDS:-25}
            TELEPHONY_LLM_RETRY_TIMEOUT_SECONDS: ${TELEPHONY_LLM_RETRY_TIMEOUT_SECONDS:-15}
            TELEPHONY_CRM_FILLER_THRESHOLD_MS: ${TELEPHONY_CRM_FILLER_THRESHOLD_MS:-1500}
            TELEPHONY_SSML_ENABLED: ${TELEPHONY_SSML_ENABLED:-true}
            TELEPHONY_BARGE_IN_ENABLED: ${TELEPHONY_BARGE_IN_ENABLED:-true}
            TELEPHONY_E2R_ALERT_P90_MS: ${TELEPHONY_E2R_ALERT_P90_MS:-850}
            TELEPHONY_MAX_TURNS: ${TELEPHONY_MAX_TURNS:-15}
            TELEPHONY_REDIS_SESSION_TTL_SEC: ${TELEPHONY_REDIS_SESSION_TTL_SEC:-7200}
            TELEPHONY_DIALOG_MAX_TURNS: ${TELEPHONY_DIALOG_MAX_TURNS:-16}
            TELEPHONY_SYNTAGMA_MIN_CHARS: ${TELEPHONY_SYNTAGMA_MIN_CHARS:-12}
            TELEPHONY_STREAM_TTS_PROVIDER: ${TELEPHONY_STREAM_TTS_PROVIDER:-yandex}
            TELEPHONY_LLM_MODE: ${TELEPHONY_LLM_MODE:-chat}
            YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
            YANDEX_SPEECHKIT_FOLDER_ID: ${YANDEX_SPEECHKIT_FOLDER_ID:-}
            ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
            GROQ_API_KEY: ${GROQ_API_KEY:-}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
            QDRANT_URL: ${QDRANT_URL}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            qdrant:
                condition: service_started
        networks:
            - rsd_network
        volumes:
            - ./backend:/backend

    telephony_media_gateway:
        build: ./telephony_media_gateway
        container_name: rsd_telephony_media_gateway
        restart: unless-stopped
        env_file:
            - .env
        environment:
            PORT: "8200"
            NODE_ENV: ${NODE_ENV:-development}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
            TELEPHONY_ORCH_EVENTS_ENABLED: ${TELEPHONY_ORCH_EVENTS_ENABLED:-true}
            TELEPHONY_ORCH_EVENTS_CHANNEL: ${TELEPHONY_ORCH_EVENTS_CHANNEL:-telephony:orch:events}
            TELEPHONY_ORCH_REPLIES_CHANNEL: ${TELEPHONY_ORCH_REPLIES_CHANNEL:-telephony:orch:replies}
            TELEPHONY_MEDIA_WS_PATH: ${TELEPHONY_MEDIA_WS_PATH:-/ws}
            TELEPHONY_MEDIA_AUDIO_FRAME_MS: ${TELEPHONY_MEDIA_AUDIO_FRAME_MS:-20}
            TELEPHONY_MEDIA_LOG_LEVEL: ${TELEPHONY_MEDIA_LOG_LEVEL:-info}
            TELEPHONY_MEDIA_MAX_CONTROL_BYTES: ${TELEPHONY_MEDIA_MAX_CONTROL_BYTES:-65536}
            TELEPHONY_MEDIA_LOOPBACK_TRANSPORT: ${TELEPHONY_MEDIA_LOOPBACK_TRANSPORT:-vox}
            TELEPHONY_MEDIA_LOOPBACK_MODE: ${TELEPHONY_MEDIA_LOOPBACK_MODE:-echo}
            TELEPHONY_MEDIA_PIPELINE_ENABLED: ${TELEPHONY_MEDIA_PIPELINE_ENABLED:-true}
            STT_PROVIDER: ${STT_PROVIDER:-yandex}
            TURN_SILENCE_MS: ${TURN_SILENCE_MS:-400}
            STT_FINAL_WAIT_MS: ${STT_FINAL_WAIT_MS:-80}
            VAD_MODEL_PATH: ${VAD_MODEL_PATH:-/app/models/silero_vad.onnx}
            VAD_SPEECH_THRESHOLD: ${VAD_SPEECH_THRESHOLD:-0.5}
            VAD_ENERGY_THRESHOLD: ${VAD_ENERGY_THRESHOLD:-0.02}
            YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
            YANDEX_SPEECHKIT_FOLDER_ID: ${YANDEX_SPEECHKIT_FOLDER_ID:-}
            DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
            TELEPHONY_STT_LANGUAGE: ${TELEPHONY_STT_LANGUAGE:-ru-RU}
            TELEPHONY_BARGE_IN_ENABLED: ${TELEPHONY_BARGE_IN_ENABLED:-true}
            TELEPHONY_BARGE_IN_SPEECH_FRAMES: ${TELEPHONY_BARGE_IN_SPEECH_FRAMES:-2}
        ports:
            - "8200:8200"
        depends_on:
            redis:
                condition: service_healthy
            telephony_orchestrator:
                condition: service_started
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - rsd_network

    wa_bridge:
        build: ./wa_bridge
        container_name: rsd_wa_bridge
        restart: unless-stopped
        environment:
            WA_USERBOT_ENV: ${WA_USERBOT_ENV:-production}
            WA_USERBOT_BRIDGE_API_KEY: ${WHATSAPP_USERBOT_BRIDGE_API_KEY:-}
            WA_USERBOT_AUTH_TTL_SECONDS: ${WA_USERBOT_AUTH_TTL_SECONDS:-600}
            WA_USERBOT_AUTH_MAX_ATTEMPTS: ${WA_USERBOT_AUTH_MAX_ATTEMPTS:-5}
            WA_USERBOT_REQUEST_WINDOW_SECONDS: ${WA_USERBOT_REQUEST_WINDOW_SECONDS:-60}
            WA_USERBOT_REQUESTS_PER_PHONE_LIMIT: ${WA_USERBOT_REQUESTS_PER_PHONE_LIMIT:-5}
            WA_USERBOT_VERIFY_WINDOW_SECONDS: ${WA_USERBOT_VERIFY_WINDOW_SECONDS:-60}
            WA_USERBOT_VERIFY_PER_PHONE_LIMIT: ${WA_USERBOT_VERIFY_PER_PHONE_LIMIT:-10}
            WA_USERBOT_SESSION_SECRET: ${WA_USERBOT_SESSION_SECRET:?WA_USERBOT_SESSION_SECRET must be set}
            WA_USERBOT_DEV_EXPOSE_CODE: ${WA_USERBOT_DEV_EXPOSE_CODE:-false}
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - rsd_network

    qdrant:
        restart: unless-stopped
        image: qdrant/qdrant:latest
        container_name: rsd_qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - qdrant_data:/qdrant/storage
        networks:
            - rsd_network

networks:
  rsd_network:
    driver: bridge

volumes:
    fastembed_cache:
    postgres_data:
    qdrant_data:
