# Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name rsd-ai.ru api.rsd-ai.ru;
    return 301 https://$host$request_uri;
}

# Сайт (SPA) + прокси /api и /webhook на том же домене
server {
    listen 443 ssl http2;
    server_name rsd-ai.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # Docker DNS: без resolver nginx кэширует IP upstream при старте контейнера.
    # После пересборки только backend (новый IP) frontend продолжает слать на старый → 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rsd_backend_upstream backend:8000;
    set $rsd_bot_upstream bot:8002;
    set $rsd_telephony_bridge_upstream telephony_bridge:8100;
    set $rsd_telephony_media_upstream telephony_media_gateway:8200;

    root /usr/share/nginx/html;
    index index.html;

    # Telethon + SOCKS: дольше обычного HTTP; иначе proxy_read_timeout 60s и 499 у клиента.
    location ^~ /api/agents/userbot/ {
        proxy_pass http://$rsd_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    # Backend ожидает пути /api/... как в FastAPI (без срезания префикса).
    location ^~ /api/admin/ai-mop/leads/excel-upload {
        client_max_body_size 20m;
        proxy_pass http://$rsd_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://$rsd_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI website edits can run >60s; avoid 504 while backend is still processing
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location ^~ /assets/websites/ {
        proxy_pass http://$rsd_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Avatars/sessions live on backend MEDIA_ROOT, not in the SPA html root.
    location ^~ /media/ {
        proxy_pass http://$rsd_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /sitemap-websites.xml {
        proxy_pass http://$rsd_backend_upstream/public-website/sitemap-websites.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Voximplant → telephony_bridge (RFC: /webhook/voximplant/:connection_id)
    location ^~ /webhook/voximplant/ {
        proxy_pass http://$rsd_telephony_bridge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    # VoxEngine → telephony_media_gateway (μ-law WebSocket, TELEPHONY_MEDIA_WS_URL=/ws)
    location ^~ /ws {
        proxy_pass http://$rsd_telephony_media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Telegram: URL вида BASE_URL/webhook/...
    location ^~ /webhook/ {
        proxy_pass http://$rsd_bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Return 404 for hidden files (except ACME challenge dir)
    location ~ /\.(?!well-known).* {
        return 404;
    }

    # Return 404 for known scanner probes and legacy endpoints
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma)(/|$) {
        return 404;
    }

    # Return 404 for sensitive file extensions
    location ~* \.(env|ini|log|sql|bak|old|swp|dist|pem|key|crt|php|pl|py|cgi)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

# Поддомен API: /docs, OpenAPI и /api/* напрямую на FastAPI (без префикса SPA)
server {
    listen 443 ssl http2;
    server_name api.rsd-ai.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rsd_backend_upstream backend:8000;
    set $rsd_bot_upstream bot:8002;
    set $rsd_telephony_bridge_upstream telephony_bridge:8100;

    # Defense in depth: never expose API schema on production (backend also disables when ENVIRONMENT=production).
    location = /docs {
        return 404;
    }
    location = /redoc {
        return 404;
    }
    location = /openapi.json {
        return 404;
    }

    location ^~ /webhook/voximplant/ {
        proxy_pass http://$rsd_telephony_bridge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    location /webhook/ {
        proxy_pass http://$rsd_bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/agents/userbot/ {
        proxy_pass http://$rsd_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    location / {
        proxy_pass http://$rsd_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
